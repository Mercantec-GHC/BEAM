name: Arduino

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile-and-verify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:renesas_uno:unor4wifi
          sketch-paths: |
            - ./Controller_Hub
          # libraries: |
          #   - name: WiFiNINA