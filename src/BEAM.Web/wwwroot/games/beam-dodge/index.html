<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BEAM Dodge</title>
    <link rel="stylesheet" href="/play/style.css">
    <style>
        body.arcade { overflow: hidden; }
        body.arcade main { max-width: none; padding: 0; }
        body.arcade main > a, body.arcade h1, body.arcade main > p:not(#score) { display: none; }
        body.arcade canvas { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; object-fit: contain; }
        body.arcade #score { position: fixed; top: 12px; right: 16px; z-index: 1; margin: 0; }
        body.arcade #start { position: fixed; bottom: 16px; right: 16px; z-index: 1; }
    </style>
</head>
<body>
<main>
    <a href="/play/index.html">Back to library</a>
    <h1>BEAM Dodge</h1>
    <p>Use ← → or drag inside the game. Dodge the falling blocks.</p>
    <p id="score" role="status">Ready</p>
    <button id="start">Start game</button>
    <canvas id="game" width="480" height="540" aria-label="Dodge falling blocks using arrow keys or touch"></canvas>
</main>
<script>document.body.classList.toggle('arcade', new URLSearchParams(location.search).get('arcade') === '1');</script>
<script src="/games/beam-dodge/game.js"></script>
</body>
</html>
