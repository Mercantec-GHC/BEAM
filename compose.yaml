name: beam

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BEAM_WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HttpsRedirection__Enabled: "false"
      HealthChecks__Enabled: "true"
      ConnectionStrings__beamdb: "Host=postgres;Port=5432;Database=beam;Username=beam;Password=${POSTGRES_PASSWORD:-beam}"
      Database__ApplyMigrations: "true"
      OTEL_SERVICE_NAME: beam-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      dashboard:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: beam
      POSTGRES_USER: beam
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-beam}"
    ports:
      - "127.0.0.1:${BEAM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beam -d beam"]
      interval: 5s
      timeout: 5s
      retries: 12

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    ports:
      - "127.0.0.1:${BEAM_DASHBOARD_PORT:-18888}:18888"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

volumes:
  postgres-data:
